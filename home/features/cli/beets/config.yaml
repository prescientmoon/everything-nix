directory: ~/media/music/pebbles
library: ~/.local/share/beets/pebbles

import:
  copy: yes #

plugins:
  - musicbrainz
  - fish
  - fetchart
  - lastgenre
  - convert
  - embedart
  # - lyrics

convert:
  auto: yes
  copy_album_art: yes
  never_convert_lossy_files: yes
  format: opus
  formats:
    opus: ffmpeg -i $source -y -vn -acodec libopus -ab 128k $dest

fetchart:
  auto: yes
  cover_format: JPEG
  max_filesize: 1048576 # 1MiB

embedart:
  auto: no
