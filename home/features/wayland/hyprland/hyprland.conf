# Fallback rule for monitors.
# More specific rules defined in the .nix file.
# https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,1,mirror,eDP-1

general {
  # cursor_inactive_timeout = 30 # Hide cursor after being inactive for 30s.
  resize_on_border = true # Click on borders with the mouse to resize.
}

input {
  kb_layout = us

  touchpad {
    natural_scroll = true # Invert scrolling direction.
  }
}

gesture = 3, vertical, workspace

misc {
  # Configure the default Hyprland branding.
  disable_hyprland_logo    = true
  disable_splash_rendering = true

  # Disable the "application not responding" dialogue.
  enable_anr_dialog        = false
}

ecosystem {
  no_update_news  = true
  no_donation_nag = true
}

animations {
  enabled = true

  animation = workspaces,1,4,default,slidevert
}

debug {
  # Required by gamescope' Wayland backend.
  full_cm_proto=true
}

# {{{ Blur & opacity
decoration {
  blur {
    popups = true
  }
}

# Blur extra surfaces.
layerrule = blur,gtk-layer-shell
layerrule = blur,osd
layerrule = blur,logout_dialog
layerrule = blur,anyrun
layerrule = blur,waybar

layerrule = noanim,anyrun

layerrule = ignorezero,gtk-layer-shell
layerrule = ignorezero,osd
layerrule = ignorezero,waybar
layerrule = ignorezero,anyrun
layerrule = ignorezero,waybar
# }}}
# {{{ Startup commands
# Execute apps at launch.
exec-once = foot & firefox & gtk-launch obsidiantui & elisa
exec-once = fcitx5
exec-once = anyrun daemon # I should make this a systemd service

# Without this, xdg-open doesn't work (?).
#
# TODO: is this still necessary? Does home-manager handle this for us?
# exec = systemctl --user import-environment PATH && systemctl --user restart xdg-desktop-portal.service && systemctl --user restart xdg-desktop-portal-termfilechooser.service
# }}}
# {{{ Window rules
# Automatically move applications to their designated workspace.
windowrulev2 = workspace 2 silent, title:^(.*Firefox.*)$
windowrulev2 = workspace 3 silent, title:^(.*(Disc|WebC)ord.*)$
windowrulev2 = workspace 3 silent, title:^(.*(V|v)esktop.*)$
windowrulev2 = workspace 3 silent, title:^(.*Element.*)$
windowrulev2 = workspace 4 silent, title:^(.*angelfold.*)$
windowrulev2 = workspace 4 silent, title:^(.*angelhorn.*)$
windowrulev2 = workspace 4 silent, title:^(.*angelzorn.*)$
windowrulev2 = workspace 6 silent, title:^(.*(S|s)pot(ify)?.*)$
windowrulev2 = workspace 6 silent, title:^(.*Elisa.*)$
windowrulev2 = workspace 7 silent, class:^(.*Obsidian.*)$
windowrulev2 = workspace 8 silent, class:^(.*Smos.*)$

# Inhibit idling while using certain apps:
# - while Firefox is in full screen mode
windowrulev2 = idleinhibit fullscreen, class:^(firefox)$
# - while watching videos
windowrulev2 = idleinhibit focus, class:^(mpv|.+exe)$
windowrulev2 = idleinhibit focus, class:^(firefox)$, title:^(.*YouTube.*)$

# Make window dance work
# windowrulev2 = windowdance, class:^(Rhythm Doctor)$, title:^(.*YouTube.*)$
# }}}
# {{{ Keybinds
$mod = SUPER

bind = $mod, C, killactive, # Kill current
bind = $mod, F, fullscreen, # Full screen

bind = $mod, return, exec, foot # Terminal
bind = $mod, Q, exec, wlogout # Show logout menu
bind = $mod, P, exec, anyrun # Show the app picker
bind = $mod, V, exec, foot vimclip # Vim anywhere!

# I don't use these often enough for them to justify having their own keybinds,
# thus I plan to remove them soon. Alternatively, I might move them into their
# own layer of sorts.
bind = $mod, T, exec, wl-ocr
bind = $mod SHIFT, T, exec, wl-qr
bind = $mod CONTROL, T, exec, hyprpicker | wl-copy && notify-send "Copied color $(wl-paste)" # Color picker
bind = $mod, B, exec, wlsunset-toggle # Toggle blue light filter thingy
bind = $mod SHIFT, B, exec, notify-send "$(acpi)"
bind = $mod, S, exec, grimblast --notify copysave area
bind = $mod SHIFT, S, exec, grimblast --notify copysave active
bind = $mod CONTROL, S, exec, grimblast --notify copysave screen
bind = $mod, I, exec, wl-tmp # Upload image to my server

# I might or might not re-enable these in the future
# bind = $mod SHIFT, L, exec, loginctl lock-session # Lock screen
# bind = $mod, W, exec, ~/projects/form-filler/type.sh

# Work with the special workspace
bind = $mod, X, togglespecialworkspace,
bind = $mod SHIFT, X, movetoworkspace, special

# Grouping
bind = $mod, G, togglegroup,
bind = $mod, L, changegroupactive, f
bind = $mod, H, changegroupactive, b

# Move/resize windows with mod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Move focus
bind = $mod, K, cyclenext,
bind = $mod, J, cyclenext, prev

# Switch to workspace
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Send to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Resize
bind=SUPER,R,submap,resize

submap=resize

# Set repeatable binds for resizing the active window.
binde=,l,resizeactive,10 0
binde=,h,resizeactive,-10 0
binde=,k,resizeactive,0 -10
binde=,j,resizeactive,0 10

bind=,escape,submap,reset

submap=reset

# Volume & brightness
binde=, XF86AudioRaiseVolume,  exec, swayosd-client --output-volume raise
binde=, XF86AudioLowerVolume,  exec, swayosd-client --output-volume lower
binde=, XF86AudioMute,         exec, swayosd-client --output-volume mute-toggle
binde=, XF86AudioMicMute,      exec, swayosd-client --input-volume  mute-toggle
binde=, XF86MonBrightnessUp,   exec, swayosd-client --brightness    raise
binde=, XF86MonBrightnessDown, exec, swayosd-client --brightness    lower

# App-specific global keybinds
# OBS
# bind = SUPER, F4, pass, ^(com\.obsproject\.Studio)$ # Start / Stop recording
# }}}
